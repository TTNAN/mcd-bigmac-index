name: 每日指数采集

on:
  schedule:
    # 每天北京时间 11:00 (UTC 03:00) —— 午餐时段, 巨无霸在售
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集今日价格
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          MCD_ADDRESS: ${{ vars.MCD_ADDRESS }}
        run: |
          if [ -z "$MCD_MCP_TOKEN" ]; then
            echo "未配置 MCD_MCP_TOKEN, 跳过本次采集 (请在仓库 Secrets 中添加)."
            exit 0
          fi
          python scripts/snapshot.py

      - name: 重绘指数图表
        run: python scripts/render.py

      - name: 提交数据更新
        run: |
          git config user.name "bigmac-bot"
          git config user.email "bigmac-bot@users.noreply.github.com"
          git add data/ assets/ README.md
          git diff --staged --quiet || git commit -m "chore: 每日指数更新 $(date -u +%F)"
          git push
