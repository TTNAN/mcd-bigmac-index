name: 每日指数采集

on:
  schedule:
    # 每天北京时间 11:00 (UTC 03:00) —— 午餐时段, 巨无霸在售
    - cron: "0 3 * * *"
    # 备份: 北京时间 13:00 再跑一次; 当天已采到数据会自动跳过, 防止 GitHub 定时任务偶发漏跑
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "当天已有数据也重新采集"
        type: boolean
        default: false

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 今天采过了吗
        id: check
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -f "data/cities/$TODAY.json" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "今天 ($TODAY) 已有数据, 跳过."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 采集今日价格
        if: steps.check.outputs.skip != '1'
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          MCD_CITIES: ${{ vars.MCD_CITIES }}
        run: |
          if [ -z "$MCD_MCP_TOKEN" ]; then
            echo "::error::未配置 MCD_MCP_TOKEN, 请在仓库 Settings → Secrets and variables → Actions 中添加."
            exit 1
          fi
          python scripts/snapshot.py

      - name: 重绘图表、README 与在线看板
        if: steps.check.outputs.skip != '1'
        run: python scripts/render.py

      - name: 提交数据更新
        if: steps.check.outputs.skip != '1'
        run: |
          git config user.name "bigmac-bot"
          git config user.email "bigmac-bot@users.noreply.github.com"
          git add data/ assets/ docs/ README.md
          git diff --staged --quiet || git commit -m "chore: 每日指数更新 $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase --autostash || true
          git push
